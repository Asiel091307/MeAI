services:
  app:
    build: .
    # Start again by itself after Docker Desktop or the PC restarts.
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: meai
      DB_USER: meai
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-gemini}
      GENERATION_MODEL: ${GENERATION_MODEL:-gemini-3.5-flash-lite}
      CHUNK_SIZE: ${CHUNK_SIZE:-}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12
  db:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: meai
      POSTGRES_USER: meai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meai -d meai"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
